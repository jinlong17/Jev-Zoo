[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-zoo"
version = "0.1.0"
description = "Resource catalog and reproducible typed-decision evaluation"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
fetch = ["huggingface_hub>=1.0,<3"]
eval = ["torch>=2.8,<3", "transformers>=5.17,<6", "datasets>=4,<5", "peft>=0.17,<1", "accelerate>=1,<2", "safetensors>=0.6", "pillow>=11", "numpy>=2,<3"]
dev = ["pytest>=8.4", "pytest-socket>=0.7", "build>=1.2", "ruff>=0.13"]

[project.scripts]
jevzoo = "jev_zoo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_zoo"]

[tool.hatch.build.targets.sdist]
include = ["src/jev_zoo", "pyproject.toml", "LICENSE", "NOTICE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
